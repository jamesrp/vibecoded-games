<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>POCKET EMPIRE</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--ink:#f3ead7;--dim:#b9ae96;--panel:rgba(22,20,28,.86);--gold:#e9c46a;--edge:rgba(233,196,106,.35)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0d1218;color:var(--ink);font:14px/1.35 Georgia,'Times New Roman',serif;overflow:hidden;user-select:none}
#map{position:absolute;inset:0;display:block}
.panel{background:var(--panel);border:1px solid var(--edge);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.45);backdrop-filter:blur(3px)}
#top{position:absolute;left:50%;top:8px;transform:translateX(-50%);display:flex;gap:14px;align-items:center;padding:6px 14px;font-size:14px;white-space:nowrap}
#top .k{color:var(--dim);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
#top .pill{display:flex;gap:6px;align-items:center;cursor:pointer}
#top .bar{width:70px;height:6px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}#top .bar i{display:block;height:100%}
#sel{position:absolute;left:10px;bottom:10px;width:300px;padding:10px 12px;display:none}
#sel h3{margin:0 0 4px;font-size:17px;letter-spacing:.03em}#sel .sub{color:var(--dim);font-size:12px;margin-bottom:6px}
.btn{display:inline-block;margin:3px 4px 0 0;padding:5px 9px;border-radius:6px;border:1px solid var(--edge);background:rgba(255,255,255,.06);color:var(--ink);cursor:pointer;font:inherit;font-size:13px}
.btn:hover{background:rgba(233,196,106,.18)}.btn kbd{color:var(--gold);font-family:inherit;font-size:11px;margin-left:4px}
#next{position:absolute;right:14px;bottom:14px;min-width:190px;padding:12px 18px;font:bold 16px Georgia,serif;letter-spacing:.05em;color:#1b1406;background:linear-gradient(#f4d688,#d9a845);border:0;border-radius:10px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.5)}
#next small{display:block;font-weight:normal;font-size:12px;opacity:.75}
#next:hover{filter:brightness(1.08)}
#toasts{position:absolute;left:50%;top:52px;transform:translateX(-50%);display:flex;flex-direction:column;gap:4px;align-items:center;pointer-events:none}
.toast{padding:5px 12px;border-radius:14px;background:rgba(15,13,20,.82);border:1px solid var(--edge);font-size:13px;animation:fade 6s forwards}
@keyframes fade{0%{opacity:0;transform:translateY(-6px)}6%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,6,10,.55)}
#modal .box{max-width:min(980px,94vw);max-height:92vh;overflow:auto;padding:18px 22px}
#modal h2{margin:0 0 6px;font-size:24px;letter-spacing:.06em;color:var(--gold)}#modal p{margin:4px 0 10px;color:var(--dim)}
.cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.card{width:220px;padding:12px;border-radius:10px;border:1px solid var(--edge);background:rgba(255,255,255,.04);cursor:pointer;transition:transform .12s}
.card:hover{transform:translateY(-3px);background:rgba(233,196,106,.12)}.card h4{margin:0 0 4px;font-size:17px}.card .tag{color:var(--gold);font-size:12px;letter-spacing:.05em;text-transform:uppercase}
.card .d{color:var(--ink);font-size:13px;margin-top:6px}.card.sel{outline:2px solid var(--gold)}
.tree{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.era h5{margin:0 0 4px;color:var(--gold);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.node{padding:5px 7px;margin-bottom:5px;border-radius:6px;border:1px solid rgba(255,255,255,.1);font-size:12px;background:rgba(255,255,255,.03)}
.node b{font-size:13px}.node.have{background:rgba(110,180,120,.22);border-color:rgba(140,210,150,.4)}.node.avail{cursor:pointer;border-color:var(--edge)}.node.avail:hover{background:rgba(233,196,106,.18)}.node.cur{outline:2px solid var(--gold)}.node.lock{opacity:.45}
.node .u{color:var(--dim)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.opt{padding:6px 8px;border-radius:6px;border:1px solid rgba(255,255,255,.12);cursor:pointer;font-size:13px;background:rgba(255,255,255,.03)}
.opt:hover{background:rgba(233,196,106,.16)}.opt .t{float:right;color:var(--gold)}.opt .x{display:block;color:var(--dim);font-size:11px}.opt.cur{outline:2px solid var(--gold)}
#coach{position:absolute;display:none;width:260px;padding:9px 12px;font-size:13.5px;line-height:1.35;z-index:6;pointer-events:auto;background:#fff6dc;color:#3a2a14;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.45);border:2px solid #e9c46a}
#coach .cx{float:right;margin:-5px -6px 0 6px;padding:0 5px;font-size:18px;line-height:1;cursor:pointer;color:#8a6a3a;border-radius:6px}#coach .cx:hover{background:rgba(233,196,106,.35);color:#3a2a14}
#coach .ca{display:block;margin-top:4px;text-align:right;font-size:11px;color:#9a7f55;cursor:pointer;text-decoration:underline dotted}
#coach:after{content:'';position:absolute;left:122px;bottom:-9px;border:8px solid transparent;border-top-color:#e9c46a;border-bottom:0}
#tip{position:absolute;pointer-events:none;display:none;padding:6px 9px;font-size:12px;max-width:260px;z-index:5}
table.sc{border-collapse:collapse;margin:8px auto}table.sc td,table.sc th{padding:3px 10px;text-align:left}table.sc th{color:var(--dim);font-weight:normal;font-size:12px}
#era{position:absolute;left:0;right:0;top:30%;text-align:center;pointer-events:none;display:none;z-index:4}
#era .t{font:bold 46px Georgia,serif;letter-spacing:.18em;color:#f4d688;text-shadow:0 0 24px rgba(233,196,106,.7),0 3px 0 #000}
#era .s{font-size:16px;color:var(--ink);letter-spacing:.3em;text-transform:uppercase;text-shadow:0 2px 0 #000}
#era.on{display:block;animation:eracard 3.6s forwards}
@keyframes eracard{0%{opacity:0;transform:scale(.8)}12%{opacity:1;transform:scale(1.04)}20%{transform:none}78%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.seg{display:inline-flex;border:1px solid var(--edge);border-radius:8px;overflow:hidden}.seg span{padding:5px 12px;cursor:pointer;font-size:13px}.seg span.on{background:rgba(233,196,106,.3);color:#fff}
.omen{display:inline-block;margin-top:8px;padding:5px 12px;border-radius:14px;border:1px dashed var(--edge);color:var(--ink);font-size:13px}
#help{position:absolute;right:14px;top:8px;padding:4px 8px;font-size:12px;color:var(--dim);cursor:pointer}
.big{font-size:44px;letter-spacing:.12em;color:var(--gold);margin:0;text-shadow:0 3px 18px rgba(233,196,106,.35)}
</style></head><body>
<canvas id="map"></canvas>
<div id="top" class="panel" style="display:none"></div>
<div id="help" class="panel">♪ M · ? Help</div>
<div id="coach"></div><div id="toasts"></div><div id="era"><div class="t"></div><div class="s"></div></div>
<div id="sel" class="panel"></div>
<button id="next" style="display:none">NEXT</button>
<div id="tip" class="panel"></div>
<div id="modal"><div class="box panel"></div></div>
<script src="src/data.js"></script>
<script src="src/core.js"></script>
<script src="src/ai.js"></script>
<script src="src/audio.js"></script>
<script src="src/render.js"></script>
<script src="src/ui.js"></script>
</body></html>
